<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9645A">
<title>Mamá en Orden Pro</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#C9604F',dark:'#A84A3B',soft:'#FBE3DB'},sage:{DEFAULT:'#2F6F62',soft:'#DDEEE8'},sun:'#F2B84B',cream:'#FFF8F3',ink:'#33241F'},fontFamily:{sans:['Nunito','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>@media print{nav,header{display:none}}details>summary{cursor:pointer;list-style:none}</style>
</head>
<body class="bg-cream text-ink font-sans pb-28">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-brand-soft pt-[env(safe-area-inset-top)]">
 <div class="max-w-3xl mx-auto px-4 py-2 flex items-center gap-3">
  <div class="flex-1"><h1 class="font-extrabold text-lg text-brand leading-tight">Mamá en Orden <span class="text-[10px] bg-sun text-ink rounded-full px-2 py-0.5 align-middle">PRO</span></h1><p id="date" class="text-xs text-ink/60 capitalize"></p></div>
  <select id="filter" aria-label="Ver solo a un miembro" onchange="F=this.value;draw()" class="rounded-xl border border-brand-soft bg-white px-3 py-2 text-sm font-bold max-w-[48%]"></select>
 </div>
</header>
<main id="app" class="max-w-3xl mx-auto px-4 py-4"></main>
<nav id="nav" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-brand-soft pb-[env(safe-area-inset-bottom)]"></nav>
<div id="modal"></div>
<div id="toasts" class="fixed top-16 inset-x-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4"></div>
<script>
/* ===== Utilidades y estado ===== */
const K='mamaenorden_pro_v1';
const COL=['#D9645A','#2F6F62','#E0A100','#6D4C9F','#2A7FB8','#C2477A','#7A8B2E','#E27D3A'];
const fresh=()=>({members:[],events:[],menu:{},shop:[],chk:{},tasks:[],habits:{},mem:[],seen:false});
let S=fresh(),F='',HL='',UNDO='',HS={r:'Mamá'},tab='home',now0=new Date(),cal={y:now0.getFullYear(),m:now0.getMonth(),sel:''};
let LS=null;try{LS=window.localStorage;LS.setItem('__t','1');LS.removeItem('__t')}catch(e){LS=null}
const T_OLD={'Cita médica':'medico','Control preventivo':'preventivo','Dental':'dental','Terapia':'terapia','Vacuna':'vacuna'},TKEYS='familiar medico pediatria vacuna dental preventivo terapia escuela otro'.split(' '),ROLE_OLD={'Adulto':'Mamá','Niño/a':'Niño'};
function norm(d){d=d&&typeof d=='object'?d:{};const b=fresh(),o={},rid=()=>'m'+Math.random().toString(36).slice(2,8),hoy=new Date().toISOString().slice(0,10);
 for(const k in b)o[k]=Array.isArray(b[k])?(Array.isArray(d[k])?d[k].filter(x=>x&&typeof x=='object'):[]):typeof b[k]=='object'?(d[k]&&typeof d[k]=='object'&&!Array.isArray(d[k])?d[k]:{}):(d[k]??b[k]);
 o.members=o.members.map(m=>({...m,id:m.id||rid(),n:m.n||'Sin nombre',e:m.e||'🌟',c:m.c||COL[0],r:ROLE_OLD[m.r]||m.r||'Mamá'}));
 o.events=o.events.map(e=>({...e,id:e.id||rid(),d:e.d||hoy,h:e.h||'',m:e.m||'',c:TKEYS.includes(e.c)?e.c:e.c=='salud'?(T_OLD[e.k]||'medico'):'familiar',al:e.al===true?2:(+e.al||0),ad:+e.ad||0}));
 (d.appts||[]).forEach(a=>o.events.push({id:a.id||rid(),t:a.t||'Cita',d:a.d||hoy,h:'',m:a.m||'',c:T_OLD[a.k]||'medico',al:0,ad:0,done:false}));
 (d.vax||[]).forEach(x=>o.events.push({id:x.id||rid(),t:x.v||'Vacuna',d:x.d||hoy,h:'',m:x.m||'',c:'vacuna',al:0,ad:0,done:!!x.ok}));
 o.tasks=o.tasks.map(t=>({...t,id:t.id||rid(),p:+t.p||5,s:t.s||(t.ok?'l':'')}));return o}
try{const r=LS?LS.getItem(K):null;if(r)S=norm(JSON.parse(r))}catch(e){S=fresh()}
const $=id=>document.getElementById(id),v=id=>$(id)?$(id).value.trim():'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],DIA=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
cal.sel=ymd();
const I='w-full rounded-xl border border-brand-soft bg-white px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-brand',BT='rounded-xl bg-brand text-white font-bold px-4 py-2.5 active:scale-95 transition',BA='rounded-xl bg-brand-soft text-brand-dark font-bold px-4 py-2.5 active:scale-95 transition',CD='bg-white rounded-2xl shadow-sm border border-brand-soft/60 p-4 mb-4',H='font-extrabold text-lg mb-2',LB='block text-xs font-bold text-ink/60 mt-2 mb-1';
function save(){try{const j=JSON.stringify(S);if(LS)LS.setItem(K,j);return true}catch(e){toast('Sin espacio guardando: exporta un respaldo y usa fotos más pequeñas','warn');return false}}
function toast(m,k,act){const d=document.createElement('div');d.setAttribute('role','status');d.className='pointer-events-auto rounded-2xl px-4 py-3 shadow-lg font-bold text-sm text-white flex items-center gap-3 '+(k=='warn'?'bg-amber-600':'bg-sage');d.innerHTML=esc(m)+(act?' <button class="underline" onclick="undo()">Deshacer</button>':'');$('toasts').appendChild(d);setTimeout(()=>d.remove(),act?7000:3500)}
const M=id=>S.members.find(m=>m.id==id),vis=m=>!F||m==F;
const chip=id=>{const m=M(id);return m?`<span class="inline-flex items-center gap-1 text-xs font-bold rounded-full px-2 py-0.5 text-white" style="background:${m.c}">${m.e} ${esc(m.n)}</span>`:'<span class="text-xs font-bold rounded-full px-2 py-0.5 bg-ink/10">👪 Familia</span>'};
const mopts=(sel,fam=true)=>(fam?'<option value="">👪 Toda la familia</option>':'')+S.members.map(m=>`<option value="${m.id}"${m.id==sel?' selected':''}>${m.e} ${esc(m.n)}</option>`).join('');
const del=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();draw()};
function ask(msg,cb,lb){window._cb=cb;modal(`<p class="font-bold text-lg mb-4">${esc(msg)}</p><div class="grid grid-cols-2 gap-2"><button class="${BA}" onclick="closeM()">Cancelar</button><button class="${BT}" onclick="closeM();_cb()">${lb||'Sí, borrar'}</button></div>`)}
function modal(h){$('modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/60 flex items-end sm:items-center justify-center p-3" onclick="if(event.target==this)closeM()"><div class="bg-white rounded-3xl p-5 w-full max-w-md max-h-[90vh] overflow-auto">${h}</div></div>`}
const closeM=()=>$('modal').innerHTML='';

/* ===== Navegación ===== */
const TABS=[['home','🏠','Inicio'],['menu','🍽️','Menú'],['tasks','✅','Tareas'],['well','🌿','Bienestar'],['mem','📸','Recuerdos'],['more','⚙️','Más']];
function go(t){tab=t;draw();scrollTo(0,0)}
function draw(){
 const views={home,menu,tasks,well:wellbeing,mem,more};
 $('app').innerHTML=views[tab]();document.body.style.background={home:'#FFF3EC',menu:'#F1F8EE',tasks:'#FFF9E6',well:'#EAF5F9',mem:'#F6EFFA',more:'#F5F2EE'}[tab];
 if(HL){const e=$('card_'+HL);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('ring-4','ring-sun');setTimeout(()=>e.classList.remove('ring-4','ring-sun'),2500)}HL=''}
 $('nav').innerHTML='<div class="max-w-3xl mx-auto flex">'+TABS.map(t=>`<button onclick="go('${t[0]}')" ${tab==t[0]?'aria-current="page"':''} class="flex-1 py-2 text-[11px] font-bold ${tab==t[0]?'text-brand':'text-ink/50'}"><span class="block text-xl">${t[1]}</span>${t[2]}</button>`).join('')+'</div>';
 $('filter').innerHTML='<option value="">👪 Todos</option>'+mopts(F,false);$('filter').value=F;
 $('date').textContent=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}

/* ===== 1 y 2: Agenda maestra (eventos, salud y alertas) ===== */
const TYPES=[['familiar','🎉','Evento familiar'],['medico','🩺','Control médico'],['pediatria','👶','Pediatría'],['vacuna','💉','Vacuna'],['dental','🦷','Dental'],['preventivo','🔎','Control preventivo'],['terapia','🧠','Terapia'],['escuela','🎒','Escuela'],['otro','⭐','Otro']];
const TY=Object.fromEntries(TYPES.map(t=>[t[0],t])),isH=e=>['medico','pediatria','vacuna','dental','preventivo','terapia'].includes(e.c);
const allEv=()=>S.events;
const tmpWarn=()=>LS?'':`<div class="${CD} bg-amber-50 border-amber-300 text-sm"><b>Modo temporal:</b> este navegador no permite guardar. Usa “Exportar datos” antes de cerrar.</div>`;
function guide(){return `<ol class="list-decimal pl-5 space-y-1.5 text-sm"><li><b>Registra a tu familia</b> en “Más → Miembros”. Cada uno tendrá su color.</li><li><b>Agenda maestra (Inicio):</b> eventos, citas, vacunas, terapias y alertas en un solo lugar.</li><li><b>Menú:</b> elige platos y tu lista de compras se arma sola. <b>Tareas:</b> marca “Logrado” o “No logrado” y suma puntos.</li><li><b>Bienestar:</b> micro-actividades para mamá, papá, niña y niño. <b>Recuerdos:</b> guarda sus logros.</li><li><b>Respalda</b> tus datos en “Más → Exportar”. Así los guardas o los pasas a otro teléfono con “Importar”.</li></ol>`}
function onboard(){modal(`<h2 class="text-2xl font-extrabold text-brand mb-1">¡Bienvenida! 🌸</h2><p class="text-sm text-ink/70 mb-3">Tu hogar organizado:</p>${guide()}<p class="text-xs text-ink/60 mt-3">Tus datos se guardan solo en este dispositivo.</p><button class="${BT} w-full mt-4" onclick="S.seen=true;save();closeM();go('more')">Empezar: agregar a mi familia</button>`)}
function evRow(e){const h=isH(e),ty=TY[e.c]||TY.otro;return `<div class="flex items-center gap-2 py-2 px-2 mt-1 rounded-xl ${h?'bg-sky-50 border-l-4 border-sky-400':'border-t border-brand-soft/60'}"><input type="checkbox" class="w-6 h-6 accent-[#2F6F62]" aria-label="Hecho" ${e.done?'checked':''} onchange="S.events.find(x=>x.id=='${e.id}').done=this.checked;save();draw()"><div class="flex-1 ${e.done?'line-through opacity-50':''}"><b>${esc(e.t)}</b> ${e.al==2?'🔔':e.al==1?'👁️':''}<div class="text-xs">${ty[1]} ${ty[2]} · ${e.d.split('-').reverse().join('/')} ${e.h||''} ${chip(e.m)}</div></div><button class="text-xl px-2 text-ink/40" aria-label="Borrar" onclick="del('events','${e.id}')">×</button></div>`}
function home(){
 const t=ymd(),hm=new Date().toTimeString().slice(0,5),nowS=t+' '+hm,lim=ymd(new Date(Date.now()+864e5))+' '+hm,in30=ymd(new Date(Date.now()+30*864e5)),A=allEv().filter(e=>vis(e.m)),k=e=>e.d+' '+(e.h||'00:00');
 const up=A.filter(e=>e.al&&!e.done&&k(e)>=nowS&&k(e)<=lim).sort((a,b)=>k(a).localeCompare(k(b)));
 const hs=A.filter(e=>isH(e)&&!e.done&&e.d>=t&&e.d<=in30).sort((a,b)=>k(a).localeCompare(k(b)));
 const first=new Date(cal.y,cal.m,1),off=(first.getDay()+6)%7,nd=new Date(cal.y,cal.m+1,0).getDate();
 let cells=DIA.map(d=>`<div class="text-center text-[11px] font-bold text-ink/50">${d}</div>`).join('')+'<div></div>'.repeat(off);
 for(let d=1;d<=nd;d++){const ds=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=A.filter(e=>e.d==ds),dots=[...new Set(ev.map(e=>isH(e)?'#38A3C8':(M(e.m)||{c:'#999'}).c))].slice(0,4);
  cells+=`<button onclick="cal.sel='${ds}';draw()" class="aspect-square rounded-xl text-sm font-bold flex flex-col items-center justify-center ${ds==cal.sel?'bg-brand text-white':ds==t?'bg-sun/40':'bg-cream'}" aria-label="${d} de ${MES[cal.m]}">${d}<span class="flex gap-0.5 h-1.5">${dots.map(c=>`<i class="w-1.5 h-1.5 rounded-full" style="background:${ds==cal.sel?'#fff':c}"></i>`).join('')}</span></button>`}
 const day=A.filter(e=>e.d==cal.sel).sort((a,b)=>(a.h||'').localeCompare(b.h||''));
 return `${tmpWarn()}<details class="${CD}" ${S.seen&&S.members.length?'':'open'}><summary class="font-extrabold">📖 Guía rápida <span class="text-xs font-normal text-ink/50">(toca para abrir o cerrar)</span></summary><div class="mt-3">${guide()}</div></details>
 ${!S.members.length?`<div class="${CD} bg-brand-soft"><b>Primero agrega a tu familia</b><p class="text-sm mb-2">Así podrás asignar eventos, tareas y recuerdos.</p><button class="${BT}" onclick="go('more')">Agregar miembros</button></div>`:''}
 ${up.length?`<div class="${CD} border-sun border-2"><h2 class="${H}">🔔 Alertas de las próximas 24 h</h2>${up.map(e=>`<div class="flex items-center gap-2 py-1"><span class="font-bold text-brand w-14">${e.h}</span><span class="flex-1 text-sm">${esc(e.t)}</span>${chip(e.m)}</div>`).join('')}</div>`:''}
 ${hs.length?`<div class="${CD} border-sky-300 border-2 bg-sky-50"><h2 class="${H}">🩺 Próximos controles de salud (30 días)</h2>${hs.map(e=>`<div class="text-sm py-1">${e.d.split('-').reverse().join('/')} · ${TY[e.c][1]} <b>${esc(e.t)}</b> ${chip(e.m)}</div>`).join('')}</div>`:''}
 <div class="${CD}"><div class="flex items-center justify-between mb-2"><button class="${BA} !px-3" aria-label="Mes anterior" onclick="cal.m--;if(cal.m<0){cal.m=11;cal.y--}draw()">‹</button><h2 class="font-extrabold">${MES[cal.m]} ${cal.y}</h2><button class="${BA} !px-3" aria-label="Mes siguiente" onclick="cal.m++;if(cal.m>11){cal.m=0;cal.y++}draw()">›</button></div><div class="grid grid-cols-7 gap-1">${cells}</div><p class="text-[11px] text-ink/50 mt-2">Punto azul = salud (citas, vacunas, terapias). Los demás llevan el color de cada miembro.</p></div>
 <div class="${CD}"><h2 class="${H}">Agenda del ${cal.sel.split('-').reverse().join('/')}</h2>${day.map(evRow).join('')||'<p class="text-sm text-ink/50">Sin eventos este día.</p>'}</div>
 <div class="${CD}"><h2 class="${H}">➕ Programar en la agenda</h2><label class="${LB}" for="ev_t">¿Qué es?</label><input id="ev_t" class="${I}" placeholder="Pediatra, vacuna de Leo, cumpleaños…">
 <div class="grid grid-cols-2 gap-2"><div><label class="${LB}" for="ev_f">Fecha</label><input id="ev_f" type="date" class="${I}" value="${cal.sel}"></div><div><label class="${LB}" for="ev_h">Hora</label><input id="ev_h" type="time" class="${I}"></div>
 <div><label class="${LB}" for="ev_c">Tipo</label><select id="ev_c" class="${I}">${TYPES.map(x=>`<option value="${x[0]}">${x[1]} ${x[2]}</option>`).join('')}</select></div><div><label class="${LB}" for="ev_m">Para</label><select id="ev_m" class="${I}">${mopts(F)}</select></div>
 <div><label class="${LB}" for="ev_a">Alerta</label><select id="ev_a" class="${I}"><option value="0">Sin alerta</option><option value="1">👁️ Visual</option><option value="2">🔔 Visual y sonora</option></select></div><div><label class="${LB}" for="ev_d">Avisar antes</label><select id="ev_d" class="${I}"><option value="0">A la hora</option><option value="10">10 min</option><option value="30">30 min</option><option value="60">1 hora</option></select></div></div>
 <div class="grid grid-cols-2 gap-2 mt-3"><button class="${BT}" onclick="addEv()">Guardar</button><button class="${BA}" onclick="ring('Así se verá tu alerta',v('ev_a')=='2')">Probar alerta</button></div></div>`}
function addEv(){if(!v('ev_t'))return toast('Escribe el nombre','warn');const al=+v('ev_a')||0;if(al&&!v('ev_h'))return toast('Pon una hora para activar la alerta','warn');
 const x={id:uid(),t:v('ev_t'),d:v('ev_f')||cal.sel,h:v('ev_h'),c:v('ev_c'),m:v('ev_m'),al,ad:+v('ev_d')||0,done:false};S.events.push(x);if(!save()){S.events.pop();return}
 const p=x.d.split('-');cal.y=+p[0];cal.m=+p[1]-1;cal.sel=x.d;toast('Guardado en la agenda ✅');draw()}
let AC;document.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function ring(t,snd){const o=document.createElement('div');o.className='fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-5';o.setAttribute('role','alertdialog');o.innerHTML=`<div class="bg-white rounded-3xl p-6 text-center max-w-sm w-full"><div class="text-5xl">⏰</div><h2 class="font-extrabold text-xl my-2"></h2><button class="${BT} w-full mb-2">Entendido</button><button class="${BA} w-full">Posponer 10 min</button></div>`;o.querySelector('h2').textContent=t;document.body.appendChild(o);
 const beep=()=>{if(!snd)return;try{const x=AC.createOscillator(),g=AC.createGain();x.connect(g);g.connect(AC.destination);x.frequency.value=880;g.gain.value=.15;x.start();x.stop(AC.currentTime+.25)}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])};beep();
 const iv=setInterval(beep,1500),end=()=>{clearInterval(iv);o.remove()},b=o.querySelectorAll('button');b[0].onclick=end;b[1].onclick=()=>{end();setTimeout(()=>ring(t,snd),6e5)}}
let lastMin='';setInterval(()=>{const n=new Date(),hm=n.toTimeString().slice(0,5);if(hm==lastMin)return;lastMin=hm;S.events.forEach(e=>{if(e.al&&!e.done&&e.d==ymd()&&e.h){const q=e.h.split(':').map(Number),tt=new Date();tt.setHours(q[0],q[1]-(+e.ad||0),0,0);if(tt.toTimeString().slice(0,5)==hm)ring((+e.ad?'En '+e.ad+' min: ':'')+e.t,e.al==2)}})},15000);

/* ===== 3: Menú inteligente y compras automáticas ===== */

const CSET=Object.entries(CATS).map(([k,w])=>[k,new Set(w.split(' '))]);
const cat=n=>{const ws=n.toLowerCase().split(/[\s/,]+/);for(const[k,st]of CSET)if(ws.some(w=>st.has(w)||st.has(w.replace(/s$/,''))||st.has(w.replace(/es$/,''))))return k;return CK[6]};
let md=0;const gm=k=>{const x=S.menu[k];return typeof x=='string'?{n:x,i:''}:(x||{n:'',i:''})};
function shopItems(){const c={};Object.values(S.menu).forEach(x=>(typeof x=='string'?'':x.i||'').split(/[,;]/).map(a=>a.trim()).filter(Boolean).forEach(a=>{const k=a.toLowerCase();c[k]=c[k]||{n:a,q:0};c[k].q++}));
 return Object.values(c).map(o=>({id:'',n:o.n,q:o.q,cat:cat(o.n),ok:!!S.chk[o.n.toLowerCase()]})).concat(S.shop.map(i=>({id:i.id,n:i.n,q:1,cat:i.c,ok:!!S.chk[i.n.toLowerCase()]})))}
function shopHtml(){const all=shopItems();return (CK.map(c=>{const l=all.filter(i=>i.cat==c).sort((a,b)=>a.n.localeCompare(b.n));return l.length?`<h3 class="font-extrabold mt-3">${c}</h3>`+l.map(i=>`<div class="flex items-center gap-2 py-1"><input type="checkbox" class="w-6 h-6 accent-[#2F6F62]" data-k="${esc(i.n.toLowerCase())}" aria-label="${esc(i.n)}" ${i.ok?'checked':''} onchange="chk(this.dataset.k,this.checked)"><span class="flex-1 ${i.ok?'line-through opacity-50':''}">${esc(i.n)}${i.q>1?` <span class="text-xs text-ink/50">(en ${i.q} comidas)</span>`:''}</span>${i.id?`<button class="text-xl px-2 text-ink/40" aria-label="Quitar" onclick="del('shop','${i.id}')">×</button>`:''}</div>`).join(''):''}).join(''))||'<p class="text-sm text-ink/50">Aún vacía. Elige platos en el menú y los ingredientes aparecerán aquí.</p>'}
const renderShop=()=>{const b=$('shopbox');if(b)b.innerHTML=shopHtml()};

function menu(){
 const tabs=DIA.map((d,i)=>`<button onclick="md=${i};draw()" class="flex-1 min-w-[46px] py-2 rounded-xl text-sm font-bold ${md==i?'bg-sage text-white':'bg-white border border-brand-soft'}">${d}${SL.some(x=>gm(i+x[0]).n)?' •':''}</button>`).join('');
 const rows=SL.map(([s,lb])=>{const k=md+s,x=gm(k);return `<div class="py-3 border-t border-brand-soft/60"><div class="font-extrabold mb-1">${lb}</div><select aria-label="Elegir sugerencia de ${lb}" class="${I}" onchange="pick('${k}','${s}',this.value)"><option value="">✨ Elegir sugerencia (${R[s].length} opciones)</option>${R[s].map(r=>`<option${r.n==x.n?' selected':''}>${r.n}</option>`).join('')}</select><input aria-label="${lb}" class="${I} mt-2" value="${esc(x.n)}" placeholder="…o escribe tu propio plato" onchange="setM('${k}','n',this.value)"><input aria-label="Ingredientes de ${lb}" class="${I} mt-2 !py-2 !text-sm" value="${esc(x.i)}" placeholder="Ingredientes separados por coma (van a tu lista)" onchange="setM('${k}','i',this.value)"></div>`}).join('');
 return `<div class="${CD}"><h2 class="${H}">🍽️ Menú semanal saludable</h2><div class="flex gap-1 mb-2">${tabs}</div><p class="text-xs text-ink/60">Elige una sugerencia latinoamericana o escribe la tuya. 🛒 Tu lista de compras se actualiza sola.</p>${rows}<button class="${BA} w-full mt-3 text-sm" onclick="SL.forEach(x=>delete S.menu[md+x[0]]);save();draw()">Limpiar este día</button><p class="text-[11px] text-ink/50 mt-2">Revisa alergias e intolerancias de tu familia antes de elegir.</p></div>
 <div class="${CD}"><h2 class="${H}">🛒 Lista de compras semanal</h2><div id="shopbox">${shopHtml()}</div>
 <div class="flex gap-2 mt-3"><input id="sh_n" class="${I}" aria-label="Artículo" placeholder="Agregar otro artículo"><button class="${BA}" onclick="addShop()">+</button></div>
 <div class="grid grid-cols-2 gap-2 mt-3 text-sm"><button class="${BA}" onclick="copyShop()">Copiar lista</button><button class="${BA}" onclick="S.chk={};save();renderShop()">Desmarcar todo</button></div></div>`}
function pick(k,s,val){const r=R[s].find(x=>x.n==val);if(!r)return;S.menu[k]={n:r.n,i:r.i};save();draw();toast('🛒 Lista actualizada')}
function setM(k,f,val){const x=gm(k);x[f]=val.trim();S.menu[k]=x;save();renderShop()}
function addShop(){const n=v('sh_n');if(!n)return;S.shop.push({id:uid(),n,c:cat(n)});save();draw()}
function copyShop(){const all=shopItems().filter(i=>!i.ok),t=CK.map(c=>{const l=all.filter(i=>i.cat==c);return l.length?c+'\n'+l.map(i=>'- '+i.n).join('\n'):''}).filter(Boolean).join('\n\n');navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Lista copiada ✅'),()=>toast('No se pudo copiar','warn')):toast('Tu navegador no permite copiar','warn')}

/* ===== 4: Tareas, logrado / no logrado y gamificación ===== */
const LV=[['Fácil',5,'🌱'],['Intermedio',10,'🌿'],['Difícil',20,'🌳']];
const lvl=p=>p<20?'🌱 Semilla':p<60?'🌿 Brote':p<120?'🌳 Árbol':'⭐ Estrella';
function tasks(){
 const ms=S.members.filter(m=>vis(m.id)),l=S.tasks.filter(t=>vis(t.m));
 const prog=ms.map(m=>{const a=S.tasks.filter(t=>t.m==m.id),g=a.filter(t=>t.s=='l'),n=a.filter(t=>t.s=='n').length,p=g.reduce((s,t)=>s+t.p,0),pc=a.length?Math.round(g.length/a.length*100):0;return `<div class="mb-4"><div class="flex justify-between text-sm font-bold">${chip(m.id)}<span>${lvl(p)} · ${p} pts</span></div><div class="h-4 bg-brand-soft rounded-full mt-1 overflow-hidden" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><div class="h-full rounded-full transition-all duration-500" style="width:${pc}%;background:${m.c}"></div></div><div class="text-xs text-ink/60 mt-1">✅ ${g.length} logradas · ❌ ${n} no logradas · ⏳ ${a.length-g.length-n} pendientes · ${pc}%</div></div>`}).join('');
 return `<div class="${CD}"><h2 class="${H}">🏆 Progreso y puntos</h2>${prog||'<p class="text-sm text-ink/50">Agrega miembros para ver su progreso.</p>'}</div>
 <div class="${CD}"><h2 class="${H}">Tareas del hogar</h2>${l.map(t=>`<div class="py-3 border-t border-brand-soft/60"><div class="flex items-start gap-2"><div class="flex-1"><b>${esc(t.t)}</b><div class="text-xs mt-0.5">${chip(t.m)} · ${LV[t.l]?LV[t.l][2]+' '+LV[t.l][0]:''} · ${t.p} pts</div></div><button class="text-xl px-2 text-ink/40" aria-label="Borrar" onclick="del('tasks','${t.id}')">×</button></div>
 <div class="grid grid-cols-2 gap-2 mt-2"><button onclick="st('${t.id}','l')" aria-pressed="${t.s=='l'}" class="rounded-xl py-2 font-bold text-sm ${t.s=='l'?'bg-sage text-white':'bg-sage-soft text-sage'}">✅ Logrado</button><button onclick="st('${t.id}','n')" aria-pressed="${t.s=='n'}" class="rounded-xl py-2 font-bold text-sm ${t.s=='n'?'bg-red-500 text-white':'bg-red-50 text-red-700'}">❌ No logrado</button></div></div>`).join('')||'<p class="text-sm text-ink/50">Sin tareas todavía.</p>'}
 <button class="${BA} w-full mt-3" onclick="S.tasks.forEach(t=>t.s='');save();draw();toast('¡Nueva semana! 🌟')">Reiniciar semana</button></div>
 <div class="${CD}"><h2 class="${H}">Nueva tarea</h2><label class="${LB}" for="tk_t">Tarea</label><input id="tk_t" class="${I}" placeholder="Poner la mesa, ordenar el cuarto…"><div class="grid grid-cols-2 gap-2"><div><label class="${LB}" for="tk_m">Responsable</label><select id="tk_m" class="${I}">${mopts(F,false)}</select></div><div><label class="${LB}" for="tk_p">Dificultad</label><select id="tk_p" class="${I}">${LV.map((x,i)=>`<option value="${i}">${x[2]} ${x[0]} (+${x[1]} pts)</option>`).join('')}</select></div></div><button class="${BT} w-full mt-3" onclick="addTk()">Agregar tarea</button></div>`}
function addTk(){if(!v('tk_t'))return toast('Escribe la tarea','warn');if(!v('tk_m'))return toast('Primero agrega miembros en “Más”','warn');const l=+v('tk_p')||0;S.tasks.push({id:uid(),t:v('tk_t'),m:v('tk_m'),l,p:LV[l][1],s:''});save();toast('Tarea agregada ✅');draw()}
function st(id,s){const t=S.tasks.find(x=>x.id==id);if(!t)return;t.s=t.s==s?'':s;save();if(t.s=='l')toast('¡Logrado! +'+t.p+' pts 🎉');else if(t.s=='n')toast('No pasa nada: mañana lo intentamos 💪');draw()}

const ROLES=[['Mamá','👩'],['Papá','👨'],['Niña','👧'],['Niño','👦']];
const WB={Mamá:['Pausa activa de 5 minutos|🤸|Cada 2 horas: gira hombros y cuello, estira los brazos y camina por la casa.','Hidratación|💧|Un vaso al despertar y uno en cada comida; deja una botella a la vista.','Respiración 4-6|🌬️|Inhala 4 segundos, exhala 6, cinco veces, antes de la siguiente tarea.','Estiramiento de espalda|🧘|Postura del niño 1 minuto y gato-vaca 10 repeticiones.','Comer con calma|🥗|Siéntate sin celular y mastica despacio al menos una comida.','Tiempo para ti|💜|Reserva 15 minutos para algo que disfrutes: música, un té o leer.'],

const curRole=()=>{const m=M(F);return m&&WB[m.r]?m.r:HS.r};
function wellbeing(){
 const r=curRole(),id=F||r,t=ymd(),L=WB[r].map(x=>x.split('|')),n=L.filter((x,i)=>S.habits[t+'|'+id+'|'+i]).length;
 return `<div class="${CD}"><h2 class="${H}">🌿 Bienestar y Hábitos</h2>${F?`<p class="text-sm mb-2">Recomendaciones para ${chip(F)}</p>`:`<p class="text-sm text-ink/60 mb-2">Elige para quién son las micro-actividades:</p><div class="grid grid-cols-4 gap-2">${ROLES.map(x=>`<button onclick="HS.r='${x[0]}';draw()" aria-pressed="${r==x[0]}" class="rounded-xl py-2 text-sm font-bold ${r==x[0]?'bg-sage text-white':'bg-sage-soft'}"><span class="block text-2xl">${x[1]}</span>${x[0]}</button>`).join('')}</div>`}
 <div class="mt-4 flex justify-between text-sm font-bold"><span>Hoy: ${n} de ${L.length}</span><span>${Math.round(n/L.length*100)}%</span></div><div class="h-3 bg-sage-soft rounded-full overflow-hidden mt-1" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${L.length}"><div class="h-full bg-sage transition-all" style="width:${n/L.length*100}%"></div></div></div>
 <div class="${CD}"><h2 class="${H}">Micro-actividades para ${ROLES.find(x=>x[0]==r)[1]} ${r}</h2>${L.map((x,i)=>{const on=S.habits[t+'|'+id+'|'+i];return `<button onclick="hab('${id}',${i})" aria-pressed="${!!on}" class="w-full text-left flex gap-3 items-start p-3 mb-2 rounded-2xl border ${on?'bg-sage-soft border-sage':'bg-white border-brand-soft'}"><span class="text-3xl">${x[1]}</span><span class="flex-1"><b class="${on?'line-through opacity-60':''}">${x[0]}</b><span class="block text-sm text-ink/70">${x[2]}</span></span><span class="text-xl">${on?'✅':'⬜'}</span></button>`}).join('')}<p class="text-xs text-ink/50">Ideas generales de bienestar; no reemplazan la consulta médica. Las citas, vacunas y controles se programan en la Agenda (Inicio).</p></div>`}
function hab(id,i){const k=ymd()+'|'+id+'|'+i;if(S.habits[k])delete S.habits[k];else{S.habits[k]=1;toast('¡Bien hecho! 🌟')}save();draw()}

/* ===== 6: Logros y recuerdos ===== */
const TIPOS=['🏆 Logro','🎓 Diploma','🥇 Premio','📈 Avance','😊 Momento feliz'];
const img=f=>new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=fr.result};fr.onerror=()=>r('');fr.readAsDataURL(f)});
function zoom(src){modal(`<img id="zimg" class="w-full rounded-2xl" alt="Foto ampliada"><button class="${BT} w-full mt-3" onclick="closeM()">Cerrar</button>`);$('zimg').src=src}
function mem(){
 const l=S.mem.filter(x=>vis(x.m)).sort((a,b)=>b.d.localeCompare(a.d));
 return `<div class="${CD}"><h2 class="${H}">📸 Muro de logros y recuerdos</h2><div class="grid grid-cols-2 gap-3">${l.map(x=>`<div id="card_${x.id}" class="rounded-2xl overflow-hidden border border-brand-soft bg-cream flex flex-col transition">${x.img?`<img src="${x.img}" alt="${esc(x.t)}" class="w-full aspect-square object-cover cursor-pointer" onclick="zoom(this.src)">`:`<div class="aspect-square flex items-center justify-center text-5xl bg-brand-soft">${x.k.split(' ')[0]}</div>`}<div class="p-2 flex-1 text-sm"><div class="text-xs text-ink/60">${x.k} · ${x.d.split('-').reverse().join('/')}</div><b>${esc(x.t)}</b><div class="my-1">${chip(x.m)}</div><p class="text-xs">${esc(x.s)}</p>${/^https?:\/\//.test(x.u||'')?`<a class="text-xs text-brand underline" target="_blank" rel="noopener" href="${esc(x.u)}">Ver enlace</a>`:''}</div><button class="text-xs text-ink/50 py-1" onclick="ask('¿Borrar este recuerdo?',()=>del('mem','${x.id}'))">Borrar</button></div>`).join('')||'<p class="col-span-2 text-sm text-ink/50">Aquí vivirán los mejores momentos. Registra el primero abajo.</p>'}</div></div>
 <div class="${CD}"><h2 class="${H}">Nuevo recuerdo</h2><div class="grid grid-cols-2 gap-2"><div><label class="${LB}" for="mm_m">Quién</label><select id="mm_m" class="${I}">${mopts(F)}</select></div><div><label class="${LB}" for="mm_k">Tipo</label><select id="mm_k" class="${I}">${TIPOS.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
 <label class="${LB}" for="mm_t">Título</label><input id="mm_t" class="${I}" placeholder="Primer día sin pañal, diploma de natación…"><label class="${LB}" for="mm_d">Fecha</label><input id="mm_d" type="date" class="${I}" value="${ymd()}"><label class="${LB}" for="mm_s">Descripción</label><textarea id="mm_s" rows="2" class="${I}"></textarea>
 <label class="${LB}" for="mm_i">Foto (opcional)</label><input id="mm_i" type="file" accept="image/*" class="${I}"><label class="${LB}" for="mm_u">Enlace a foto o video (opcional)</label><input id="mm_u" type="url" class="${I}" placeholder="https://"><button id="mm_b" class="${BT} w-full mt-3" onclick="addMem()">Guardar recuerdo</button></div>`}
async function addMem(){if(!v('mm_t'))return toast('Ponle un título','warn');const b=$('mm_b');if(b){b.disabled=true;b.textContent='Guardando…'}const im=await img($('mm_i').files[0]);
 const x={id:uid(),m:v('mm_m'),k:v('mm_k'),t:v('mm_t'),d:v('mm_d')||ymd(),s:v('mm_s'),u:v('mm_u'),img:im};S.mem.push(x);if(!save()){S.mem.pop();draw();return}HL=x.id;toast('¡Recuerdo guardado! 💛');draw()}

/* ===== 7: Más — miembros y respaldo ===== */
const EMO=['👩','👨','👧','👦','🧒','👶','👵','👴','🐻','🦊','🌟','🦋'];let EC='';
function more(){
 return `${tmpWarn()}<div class="${CD}"><h2 class="${H}">👨‍👩‍👧 Miembros de la familia</h2>${S.members.map(m=>`<div class="flex items-center gap-2 py-2 border-t border-brand-soft/60">${chip(m.id)}<span class="flex-1 text-xs text-ink/60">${esc(m.r)}</span><button class="rounded-lg bg-brand-soft px-3 py-1.5 text-sm font-bold" aria-label="Editar ${esc(m.n)}" onclick="editMb('${m.id}')">✏️ Editar</button><button class="rounded-lg bg-red-50 text-red-700 px-3 py-1.5 text-sm font-bold" aria-label="Eliminar ${esc(m.n)}" onclick="delMem('${m.id}')">✕ Eliminar</button></div>`).join('')||'<p class="text-sm text-ink/50">Aún no hay miembros.</p>'}
 <h3 class="font-bold mt-4">Agregar miembro</h3><div class="grid grid-cols-3 gap-2"><div class="col-span-2"><label class="${LB}" for="mb_n">Nombre</label><input id="mb_n" class="${I}"></div><div><label class="${LB}" for="mb_e">Ícono</label><select id="mb_e" class="${I} !px-2">${EMO.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
 <label class="${LB}" for="mb_r">Rol</label><select id="mb_r" class="${I}" onchange="$('mb_e').value=(ROLES.find(r=>r[0]==this.value)||[0,'🌟'])[1]">${ROLES.map(r=>`<option>${r[0]}</option>`).join('')}</select><button class="${BT} w-full mt-3" onclick="addMb()">Agregar miembro</button></div>
 <div class="${CD}"><h2 class="${H}">💾 Respaldo de datos</h2><p class="text-sm text-ink/70 mb-3">Descarga todo en un archivo JSON o restáuralo en este u otro dispositivo.</p><div class="grid grid-cols-2 gap-2"><button class="${BT}" onclick="exp()">⬇️ Exportar datos</button><button class="${BA}" onclick="$('imp').click()">⬆️ Importar datos</button></div><input id="imp" type="file" accept="application/json,.json" class="hidden" onchange="imp(this)">
 <button class="w-full mt-3 text-sm text-red-700 underline" onclick="ask('Se borrarán TODOS los datos de este dispositivo. ¿Seguro?',resetAll,'Sí, borrar todo')">Borrar todos los datos</button></div>
 <div class="${CD}"><h2 class="${H}">📖 Guía rápida</h2>${guide()}</div><p class="text-center text-xs text-ink/40">Mamá en Orden Pro · Tus datos viven solo en tu dispositivo</p>`}
function addMb(){if(!v('mb_n'))return toast('Escribe un nombre','warn');S.members.push({id:uid(),n:v('mb_n'),e:v('mb_e'),r:v('mb_r'),c:COL[S.members.length%COL.length]});save();toast('Miembro agregado 🎉');draw()}
function editMb(id){const m=M(id);if(!m)return;EC=m.c;modal(`<h2 class="font-extrabold text-xl mb-2">Editar miembro</h2><label class="${LB}" for="ed_n">Nombre</label><input id="ed_n" class="${I}" value="${esc(m.n)}"><div class="grid grid-cols-2 gap-2"><div><label class="${LB}" for="ed_e">Ícono</label><select id="ed_e" class="${I}">${EMO.map(x=>`<option${x==m.e?' selected':''}>${x}</option>`).join('')}</select></div><div><label class="${LB}" for="ed_r">Rol</label><select id="ed_r" class="${I}">${ROLES.map(r=>`<option${r[0]==m.r?' selected':''}>${r[0]}</option>`).join('')}</select></div></div>
 <p class="${LB}">Color</p><div class="flex flex-wrap gap-2">${COL.map(c=>`<button aria-label="Color ${c}" class="w-9 h-9 rounded-full ${c==m.c?'ring-4 ring-ink/40':''}" style="background:${c}" onclick="EC='${c}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('ring-4','ring-ink/40'));this.classList.add('ring-4','ring-ink/40')"></button>`).join('')}</div>
 <div class="grid grid-cols-2 gap-2 mt-4"><button class="${BA}" onclick="closeM()">Cancelar</button><button class="${BT}" onclick="saveMb('${id}')">Guardar</button></div>`)}
function saveMb(id){const m=M(id);if(!m||!v('ed_n'))return toast('Escribe un nombre','warn');m.n=v('ed_n');m.e=v('ed_e');m.r=v('ed_r');m.c=EC||m.c;save();closeM();toast('Miembro actualizado ✅');draw()}
function delMem(id){const m=M(id);if(!m)return;UNDO=JSON.stringify(S);S.members=S.members.filter(x=>x.id!=id);S.tasks=S.tasks.filter(t=>t.m!=id);['events','mem'].forEach(k=>S[k].forEach(x=>{if(x.m==id)x.m=''}));Object.keys(S.habits).forEach(k=>{if(k.split('|')[1]==id)delete S.habits[k]});if(F==id)F='';save();draw();toast(m.n+' eliminado','',1)}
function undo(){if(!UNDO)return;try{S=norm(JSON.parse(UNDO))}catch(e){return}UNDO='';save();draw();toast('Restaurado ✅')}
function resetAll(){try{if(LS)LS.removeItem(K)}catch(e){}S=fresh();F='';HS={r:'Mamá'};UNDO='';cal.sel=ymd();save();draw();toast('Datos borrados')}
async function exp(){const fn='mama-en-orden-respaldo-'+ymd()+'.json',txt=JSON.stringify({app:'mama-en-orden-pro',v:3,at:new Date().toISOString(),data:S},null,1);
 try{let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){await dl.save({filename:fn,data:txt});toast('Respaldo guardado ✅');return}
  const b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Respaldo descargado ✅')}
 catch(e){if(e&&e.code=='declined')return;toast('No se pudo descargar el respaldo','warn')}}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{const j=JSON.parse(r.result);d=j.data||j;if(!d||!Array.isArray(d.members))throw 0}catch(e){return toast('Archivo no válido','warn')}ask('Esto reemplazará los datos actuales. ¿Continuar?',()=>{S=norm(d);F='';save();draw();toast('Datos restaurados ✅')},'Sí, restaurar')};r.readAsText(f);inp.value=''}

draw();if(!S.seen)onboard();
</script>
</body>
</html>
